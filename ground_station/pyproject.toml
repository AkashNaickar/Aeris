[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "aeris"
version = "0.1.0"
description = "Offline Multimodal Drone for Predictive Crop Disease Mapping"
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.8",
    "numpy>=1.24",
    "ultralytics>=8.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "fastapi>=0.104",
    "uvicorn[standard]>=0.24",
    "python-multipart>=0.0.6",
    "pillow>=10.0",
    "folium>=0.20.0",
    "streamlit>=1.28",
    "streamlit-folium>=0.15",
    "watchdog>=3.0",
    "piexif>=1.1",
    "httpx>=0.25",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]
